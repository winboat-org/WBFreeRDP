name: Portable WBFreeRDP

on:
  push:
    branches: [winboat-3.30]
    tags: ['winboat-3.30.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build the static musl client
        env:
          CONTAINER_ENGINE: docker
          JOBS: '4'
        run: sh packaging/musl/build.sh
      - name: Test without a system libc or FreeRDP installation
        env:
          CONTAINER_ENGINE: docker
        run: python3 packaging/musl/smoke.py build/musl/stage
      - name: Upload the package, tests, symbols and sources
        uses: actions/upload-artifact@v7
        with:
          name: wbfreerdp-linux-x64
          path: |
            build/musl/artifacts/*
            build/musl/stage/container-smoke.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
